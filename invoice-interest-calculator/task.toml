[task]
name = "afterquery/invoice-interest-calculator"

[metadata]
author_name = "Tonny Muthoka"
author_email = "tonnysammy952@gmail.com"

difficulty_explanation = """
This is a correctness task, not an optimization-quality task: the agent must submit code that computes the exact overdue balance on an invoice (remaining principal plus accrued interest plus accrued late fees) given a jurisdiction's interest/fee rules, and the grading question is whether each computed number is exactly right, not how close it is to some heuristic baseline. The rules interact in ways that are individually simple but easy to get wrong in combination: interest accrues daily on the remaining principal starting after a grace period; the annual rate used for a given day depends on which entry in a rate schedule was in effect on that specific day (schedules can change mid-accrual); compounding, when specified, capitalizes accrued interest into principal at each calendar month boundary (including across a February, leap year or not); a late fee triggers exactly once, on a specific day relative to the due date (independently of the grace period, so it can fall before, during, or after it) and can be a flat amount or a percentage of principal subject to a cap; and payments are applied in a jurisdiction-specific order (fees, then interest, then principal, or some other order) that changes the principal base future interest accrues on. To measure whether these interactions are genuinely necessary (not just plausible-sounding), 7 adversarial implementations were built, each getting exactly ONE of these rules wrong while implementing everything else correctly -- not strawmen. Measured on the actual held-out scenario (266 queries: 15 hand-designed cases each targeting one specific rule interaction -- a grace-period boundary, a mid-window rate change, a late-fee threshold boundary, a fee-cap engagement, monthly compounding across February in both a leap and non-leap year, payment-allocation-order sensitivity, both day-count conventions, a long-horizon rounding-drift check, and a fee-triggers-before-grace-period-ends case -- plus 250 independently generated random cases, scaled up from an initial 85-query set specifically to confirm the weakest probe's measured gap was real and not sampling noise), the best of these adversarial implementations answered 96.2% of queries correctly within the stated tolerance (a 1-day fee-timing shift that rarely changes the outcome); the worst answered 22.6% correctly. The correct reference answers 100% correctly by construction (it IS the correct computation, not an approximation of one), and the pass bar (262/266 = 98.5%) sits strictly between the best adversarial probe and the reference -- a narrower margin than the other 5 probes show, but one confirmed to hold up under a 3x scale-up of the held-out set rather than close. All scenario data is synthetically generated for this task and does not represent any real jurisdiction's actual interest or fee law.
"""

solution_explanation = """
The reference solution implements the rules exactly as specified in environment/engine/README.md: daily interest accrual in exact (non-floating-point) decimal arithmetic on the current remaining principal, selecting each day's rate from whichever schedule entry was effective as of that day; monthly capitalization of accrued interest into principal at each calendar-month boundary when compounding is "monthly"; a one-time late fee triggered on the first qualifying day (independently of the grace period), computed as either a flat amount or a capped percentage of principal; and payments applied in the jurisdiction's specified allocation order (fees, then interest, then principal, or another order), each stage fully satisfied before the next. Rounding is applied only to the single final number returned per query, never to any intermediate accrual. This produces the exact correct answer by construction, not an approximation -- it scores 266/266 (100%) on the held-out scenario. A genuine bug was caught and fixed during calibration: the day-by-day accrual loop started at accrual_start rather than at the earliest of accrual_start, the fee-trigger day, or any payment date, silently skipping a fee trigger (or an early payment) that fell before interest started accruing. Caught via a hand-constructed case (fee threshold shorter than the grace period) and confirmed to have broader real impact than that one scenario (any payment landing before accrual_start with a 0-day grace period was also affected); fixed identically in the reference calculation, the shipped solution, and the adversarial probes' shared base logic, and re-verified that the fixed solution and the fixed reference agree on all 266 held-out queries with zero discrepancy.
"""

verification_explanation = """
The verifier never executes the candidate's code in the trusted stage and never trusts anything the untrusted stage computes. Stage 1 (unprivileged, 60-second timeout, UID-swept after running) imports the candidate's submitted policy module and calls its compute_balances(invoices, payments, jurisdiction_rules, queries) function ONCE against the sealed held-out scenario (a single call is sufficient here -- this is a pure deterministic calculation with no search or randomness involved, unlike a prior task this session that needed a double-call determinism check); the only thing it hands off to Stage 2 is the raw returned answers dict, not a computed score. Stage 2 (trusted, root, executes no candidate code at all) independently recomputes the correct balance for every query directly from the sealed reference calculation and the same held-out input data, and compares each submitted answer against it within a small (5-cent) tolerance -- deliberately wide enough to not penalize a legitimate but different rounding order (e.g. rounding each day's accrual rather than only the final total, which drifts by at most 1-2 cents even over a two-year accrual horizon in direct testing), but far too narrow for any of the 6 substantively-wrong adversarial implementations to reliably slip through (their best case reaches 96.2% of queries correct against a 98.5% bar). The reference calculation module itself (reference_calc.py) lives under tests/sealed/reference/, locked to root-only access before Stage 1 ever starts, and is imported lazily -- only inside Stage 2's scoring function, never at module load time -- specifically so that Stage 1's process (which the untrusted candidate code shares) never has occasion to read it, even indirectly through a chain of imports. The reward file is written as plain text (exactly "0" or "1") to /logs/verifier/reward.txt, which is locked root-only before Stage 1 runs and re-written by Stage 2 after independently recomputing the result -- Stage 1 has no access to it at all.
"""

category = "Operations"
subcategory = "Finance"
tags = ["accounts-receivable", "finance", "interest-calculation", "invoicing", "late-fees", "billing"]
expert_time_estimate_hours = 6
relevant_experience = """
I work as an operations and business data analyst (2024-present), where I have directly reviewed business scenarios involving financial operations, reconciliation, and resource allocation -- assessing account records, payment records, and operational priorities using structured data analysis, and applying rule-based reasoning to determine correct outcomes under real business constraints. This gives me a working sense of what a genuine accounts-receivable / collections operation actually has to get right when computing what a customer owes on an overdue invoice (interest accrual, grace periods, rate changes, compounding, late fees, how a partial payment gets applied) and what a realistic versus contrived version of that calculation looks like. I also evaluate AI-generated business outputs against predefined criteria and have supported AI training/evaluation projects involving business reasoning and quality assurance across operational scenarios, which is directly relevant to judging whether this task's grading (independently recomputing the correct balance for each held-out query and checking it against a calibrated correctness bar) is a fair and meaningful test rather than an arbitrary one. I am not a software engineer and have not previously built financial calculation engines; the technical implementation (the reference calculation, the two-stage verifier, and the calibration of the pass bar against measured adversarial implementations) was built with AI assistance under my direction, with my own judgment applied to whether the rules and grading reflect a realistic overdue-invoice calculation rather than an arbitrary one.
"""

