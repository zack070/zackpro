[task]
name = "afterquery/field-service-dispatch"

[metadata]
author_name = "Tonny Muthoka"
author_email = "tonnysammy952@gmail.com"

difficulty_explanation = """
This work is performed by field-service and workforce-dispatch planners at operations that send technicians to skill-matched jobs against SLA deadlines -- HVAC/electrical/plumbing service companies, telecom and utility field service, and similar dispatch-heavy operations. The agent must produce a dispatch policy (code, not a single plan) that generalizes to a shift it never saw during development, under three interacting mechanisms with no known efficient exact solver: technician fatigue that inflates job duration once a technician has worked 180 continuous minutes without a break, SLA-breach cascades where a missed urgent job spawns a follow-up job that consumes further capacity, and a hard overtime cap that removes a technician from consideration entirely rather than merely penalizing lateness. We explicitly adversarially tested the most obvious approach an agent could write directly from the fully-disclosed rules with no experimentation at all -- sort pending jobs by deadline, assign each to the first eligible free technician, with zero fatigue, urgency, or scarcity awareness -- and confirmed by direct measurement that it fails the calibrated bar by a wide margin (cost 747.0 against a bar of 370.0 on the held-out scenario), while a policy that actively prioritizes urgent jobs, avoids assigning already-fatigued technicians when a rested eligible alternative exists, and reserves scarce-skill technicians for jobs only they can do reaches 318.5 on the same scenario. Because jobs arrive dynamically mid-shift and the fatigue/cascade dynamics are path-dependent (the cost of an assignment depends on the technician's entire prior history that shift, and on which other jobs later breach as a downstream consequence), closing that gap requires actually running the simulator against real scenarios to discover which tradeoffs matter, not just reading the disclosed mechanics once. All scenario data (technicians, skills, jobs, arrival times) is synthetically generated for this task and does not represent any real company's operations.
"""

solution_explanation = """
The reference solution prioritizes urgent jobs ahead of standard ones (then earliest deadline within each priority tier), and among eligible free technicians for a job prefers ones not currently fatigued, further preferring to preserve technicians whose skill set is scarce for jobs only they can perform. This was one of two independently-designed heuristics built and measured; both clear the calibrated pass bar with comparable margin, which is itself part of the calibration evidence that the bar reflects a general skill (urgency/fatigue/scarcity awareness) rather than one specific implementation. The pass bar for the held-out grading scenario was set at this reference policy's measured cost (318.5) plus a fixed additive margin (51.5), after directly measuring three points on the same held-out scenario: a naive FIFO-greedy baseline (1451.5), the single most obvious rule an agent could write with no experimentation at all -- earliest-deadline-first with no fatigue/urgency/scarcity awareness (747.0) -- and the reference policy (318.5), confirming real, substantial headroom between "the first idea anyone would try" and a genuinely considered policy before finalizing the bar at 370.0.
"""

verification_explanation = """
The verifier never executes the candidate's code in the trusted stage and never trusts anything the untrusted stage computes. Stage 1 (unprivileged, 120-second wall-clock budget for the full run, UID-swept after running) imports the candidate's submitted policy module and runs it, via the real simulator, against the sealed held-out scenario -- but the only thing it hands off to Stage 2 is the raw sequence of (technician_id, job_id) pairs the policy's decide() function returned at each call (the "decision trace"), not a computed score. Stage 2 (trusted, root, executes no candidate code at all) mechanically replays that exact sequence through the same deterministic event loop used to build the sealed scenario, independently re-validating every claimed assignment from scratch (technician actually free, job actually pending, skill match, finish time within the technician's overtime cap) and recomputing total cost from first principles. A fabricated or inconsistent trace can only replay to an equal or worse score than a faithful one, never better, since replay strictly re-derives validity rather than trusting the trace's implied legality. The pass bar (370.0) is compared against this independently replayed cost.
"""

category = "Operations"
subcategory = "Logistics"
tags = ["dispatch", "scheduling", "simulation", "workforce-management", "logistics", "discrete-event"]
expert_time_estimate_hours = 5
relevant_experience = """
I work as an operations and business data analyst (2024-present), where I have directly reviewed business scenarios involving logistics, dispatch, and resource allocation -- assessing routing, resource allocation, inventory levels, production constraints, and operational priorities using structured data analysis, and applying rule-based reasoning to determine correct outcomes under real operational constraints. This gives me a working sense of what a genuine field-service/workforce dispatch operation actually has to balance (technician availability, skill coverage, deadline pressure, overtime cost) and what a realistic versus contrived version of that tradeoff looks like. I also evaluate AI-generated business outputs against predefined criteria and have supported AI training/evaluation projects involving business reasoning and quality assurance across operational scenarios, which is directly relevant to judging whether this task's grading (a held-out simulation replay against a calibrated cost bar) is a fair and meaningful test rather than an arbitrary one. I am not an optimization or simulation engineer and have not previously built discrete-event simulators; the technical implementation (the simulator, the trace-replay verifier, and the calibration of the pass bar against measured baseline and reference policy performance) was built with AI assistance under my direction, with my own judgment applied to whether the scheduling rules and grading reflect a realistic dispatch operation.
"""

