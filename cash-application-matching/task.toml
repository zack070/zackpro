artifacts = ["/app/outputs"]

[task]
name = "afterquery/cash-application-matching"

[metadata]
author_name = "Tonny Muthoka"
author_email = "tonnysammy952@gmail.com"

difficulty_explanation = """
This work is performed by accounts-receivable / cash-application analysts at any company that receives batches of customer payments against open invoices -- a real, widely outsourced finance operation, since a payment's own reference data is frequently incomplete or absent and the correct application has to be worked out from amounts alone. The agent must submit code that partitions a batch of payments among open invoices (each payment applied whole to at most one invoice, but multiple payments may combine to cover a single invoice) to minimize unresolved dollars, which is the Multiple Subset-Sum problem. An earlier version of this task used small per-customer instances (<=9 payments) where NP-hardness is asymptotic but practically vacuous -- a bitmask/subset dynamic-programming solver, a standard algorithms-course technique, found the exact optimum in under a second, so the task was solvable by direct recall of a known pattern rather than genuine investigation. This version corrects that: per-customer instances now have 20-30 payments and 15-22 invoices (10 customers per scenario), a scale where exact solving is not merely slower but impractical -- we measured the same bitmask DP directly on this scenario family and it takes 17 seconds at 15 payments and does not finish in 120 seconds at 18; these scenarios go well beyond that. At this scale, closing the gap requires genuine approximate search, and genuine iteration matters: measured directly on the held-out scenario, a single minimally-tuned search attempt (1500 iterations of simulated annealing) reaches only 10.0% of total payment value uncleared, while the same approach given more iterations (3000+) reaches 7.1% -- the agent has to test against the provided samples, observe that a first attempt falls short, and invest real additional effort or a better technique, not just recognize the right algorithm once. Six adversarial greedy probe policies (covering every plausible sort-order and accumulation-strategy combination we could construct) were swept across 15 independently generated scenarios and land at 16.1%-22.6% uncleared with zero exceptions -- consistently far short regardless of tuning, since no amount of iteration improves a sorting-based approach's fundamental ceiling. Two structurally independent search algorithms (simulated annealing over reassignments; a GRASP-style randomized-construction-plus-repair loop) both converge to 3.7%-5.7% when adequately tuned, a robust 3.4x-5.4x gap over the best greedy probe on every scenario tried. All scenario data (customers, payment amounts, invoice amounts) is synthetically generated for this task and does not represent any real company's receivables.
"""

solution_explanation = """
The reference solution runs two structurally different search algorithms per customer and keeps whichever result scores better: simulated annealing over single reassignment moves (seeded by a best-fit-decreasing greedy construction), and a GRASP-style loop that repeatedly builds a randomized greedy solution and repairs it via large-neighborhood destroy-and-reinsert moves. At the task's instance scale (20-30 payments per customer), exact solving is not computationally reachable -- a bitmask dynamic-programming solver was measured directly on this scenario family and already takes 17 seconds at 15 payments, well before reaching this task's 20-30 range -- so the two approaches serve as cross-validation of each other rather than validation against a known exact optimum. Across 15 independently generated scenarios, both algorithms consistently reach 3.7%-5.7% of total payment value uncleared (taking the better of the two per customer typically lands at the low end of that range), while six adversarial greedy probes are stuck at 16.1%-22.6% with zero exceptions -- the two search algorithms landing in the same narrow band despite being structurally unrelated is the calibration evidence that this is a real, reachable floor rather than an artifact of one specific algorithm. Effort sensitivity was measured directly on the held-out scenario: a single annealing pass needs roughly 3000+ iterations (not 200-1500) before it enters the pass bar's territory, confirming that clearing the bar requires genuine invested search, not just picking the right algorithm family. The pass bar (2,030,000 cents) was set on the held-out scenario between the best adversarial probe (5,507,792 cents) and the combined reference (1,200,690 cents), closer to the reference side but comfortably above the quick-attempt range, leaving margin for legitimate implementation variance in a from-scratch search-based approach.
"""

verification_explanation = """
The verifier never executes the candidate's code in the trusted stage and never trusts anything the untrusted stage computes. Stage 1 (unprivileged, 90-second wall-clock budget, UID-swept after running) imports the candidate's submitted policy module and calls its match(payments, invoices) function exactly once against the sealed held-out scenario -- but the only thing it hands off to Stage 2 is the raw returned mapping (payment_id -> invoice_id), not a computed score. Stage 2 (trusted, root, executes no candidate code at all) independently recomputes the score from that raw mapping and the same sealed scenario data, using the same scoring function that also enforces every legality rule from scratch (a payment applied to a nonexistent invoice, or to an invoice belonging to a different customer, is dropped, not trusted). A fabricated or nonsensical mapping can only score as its literal content allows once independently re-validated -- there is no step where Stage 2 takes Stage 1's word for anything. The pass bar (2,030,000 cents) is compared against this independently recomputed cost. Both the sealed reference directory and the reward file's own directory are locked to root-only access before Stage 1 ever starts, independent of the untrusted-process sweep that also runs after each stage. The reference solution completes in under 2 seconds on the held-out scenario, well inside the 90-second budget, confirming the timeout is not itself a source of difficulty.
"""

category = "Operations"
subcategory = "Finance"
tags = ["accounts-receivable", "cash-application", "finance", "matching", "combinatorial-optimization", "invoice-reconciliation"]
expert_time_estimate_hours = 6
relevant_experience = """
I work as an operations and business data analyst (2024-present), where I have directly reviewed business scenarios involving financial operations, reconciliation, and resource allocation -- assessing account records, payment records, and operational priorities using structured data analysis, and applying rule-based reasoning to determine correct outcomes under real business constraints. This gives me a working sense of what a genuine accounts-receivable / cash-application operation actually has to balance (matching incoming payments to the right open invoices, respecting per-customer boundaries, working within short-pay tolerances) and what a realistic versus contrived version of that problem looks like. I also evaluate AI-generated business outputs against predefined criteria and have supported AI training/evaluation projects involving business reasoning and quality assurance across operational scenarios, which is directly relevant to judging whether this task's grading (an independently recomputed score against a calibrated cost bar) is a fair and meaningful test rather than an arbitrary one. I am not an optimization engineer and have not previously built combinatorial solvers; the technical implementation (the scoring engine, the two-stage verifier, and the calibration of the pass bar against measured baseline and reference policy performance) was built with AI assistance under my direction, with my own judgment applied to whether the matching rules and grading reflect a realistic cash-application operation.
"""

