artifacts = ["/app/outputs"]

[task]
name = "afterquery/cash-application-matching"

[metadata]
author_name = "Tonny Muthoka"
author_email = "tonnysammy952@gmail.com"

difficulty_explanation = """
This work is performed by accounts-receivable / cash-application analysts at any company that receives batches of customer payments against open invoices -- a real, widely outsourced finance operation, since a payment's own reference data is frequently incomplete or absent and the correct application has to be worked out from amounts alone. The agent must submit code that partitions a batch of payments among open invoices (each payment applied whole to at most one invoice, but multiple payments may combine to cover a single invoice) to minimize unresolved dollars, which is the Multiple Subset-Sum problem. Two earlier calibrations of this task were each shown wrong by direct measurement, and both corrections are reflected in the current design. First: per-customer instances are now large enough (20-30 payments, 15-22 invoices; 10 customers per scenario) that exact solving is not merely slower but impractical -- a bitmask dynamic-programming solver was measured directly on this scenario family and takes 17 seconds at 15 payments and does not finish in 120 seconds at 18, well short of this task's 20-30 range. Second, and more subtle: grading gives the submitted policy a genuine wall-clock budget (up to 90 seconds), not a small number of iterations, and a plain best-fit-decreasing-seeded hill climb that never accepts a worse move can run hundreds of thousands of cheap reassignment attempts in that time -- measured directly on the held-out scenario at 10/30/60/75-second budgets, this plain approach lands at 5.6%-6.6% of total payment value uncleared and does NOT improve with more time, a genuine local-optimum ceiling, not a slow convergence curve. An adaptive simulated-annealing implementation (its cooling schedule is derived from a live calibration burst, not a fixed constant, so it actually uses the available time rather than converging early or never converging) reaches 3.7%-5.1% at the same budgets on multiple independently generated scenarios -- a consistent, budget-independent 1.2x-1.7x gap that reflects genuine algorithmic difference, not just "let it run longer." Six adversarial greedy probe policies (covering every plausible sort-order and accumulation-strategy combination we could construct, none of them time-budget-aware) were swept across 15 independently generated scenarios and land at 16.1%-22.6% uncleared with zero exceptions. All scenario data is synthetically generated for this task and does not represent any real company's receivables.
"""

solution_explanation = """
The reference solution is a time-budget-aware simulated annealing search, seeded by a best-fit-decreasing greedy construction, run independently per customer. Its cooling rate is not a fixed constant -- it is derived from a brief live calibration burst (how many cost-evaluation iterations this specific machine achieves per second, for this specific customer's size) so that temperature decays to near-zero exactly at the per-customer deadline, whatever that turns out to be. This matters because an earlier version used a fixed exponential decay rate tuned for one iteration count, and a real reviewer's measurement showed a plain (non-annealing) hill climb given the FULL realistic grading budget (not a small fixed iteration count) could come close to that earlier reference's quality using no real algorithmic insight at all -- confirming the earlier calibration measured the wrong thing (iteration count) rather than the real constraint (wall-clock time). Recalibrated directly: the same plain hill-climb algorithm, given the full ~75-80 second realistic budget, plateaus at 5.6%-6.6% of total payment value across multiple scenarios and does not improve with more time (measured at 10s, 30s, 60s, and 75s budgets on the held-out scenario: 6.3%, 6.6%, 6.3%, 6.4% -- flat). The adaptive annealing reference, given the same budgets, reaches 3.7%-5.1% -- a real, budget-independent quality gap from the annealing schedule itself. The pass bar (1,200,000 cents, roughly 4.7% on the held-out scenario) sits just above the adaptive-annealing reference's measured cost (927,470 cents) and well below the plain-hill-climb ceiling (1,618,185 cents) regardless of how much time that ceiling is given.
"""

verification_explanation = """
The verifier never executes the candidate's code in the trusted stage and never trusts anything the untrusted stage computes. Stage 1 (unprivileged, 90-second wall-clock budget, UID-swept after running) imports the candidate's submitted policy module and calls its match(payments, invoices) function exactly once against the sealed held-out scenario -- but the only thing it hands off to Stage 2 is the raw returned mapping (payment_id -> invoice_id), not a computed score. Stage 2 (trusted, root, executes no candidate code at all) independently recomputes the score from that raw mapping and the same sealed scenario data, using the same scoring function that also enforces every legality rule from scratch (a payment applied to a nonexistent invoice, or to an invoice belonging to a different customer, is dropped, not trusted). A fabricated or nonsensical mapping can only score as its literal content allows once independently re-validated -- there is no step where Stage 2 takes Stage 1's word for anything. The pass bar (1,200,000 cents) is compared against this independently recomputed cost. Both the sealed reference directory and the reward file's own directory are locked to root-only access before Stage 1 ever starts, independent of the untrusted-process sweep that also runs after each stage. The reference solution deliberately uses close to the full 90-second Stage 1 budget (75 seconds of active search, the rest as safety margin for import/IO overhead), since its whole design point is that the available wall-clock time is part of what a submission needs to use well.
"""

category = "Operations"
subcategory = "Finance"
tags = ["accounts-receivable", "cash-application", "finance", "matching", "combinatorial-optimization", "invoice-reconciliation"]
expert_time_estimate_hours = 6
relevant_experience = """
I work as an operations and business data analyst (2024-present), where I have directly reviewed business scenarios involving financial operations, reconciliation, and resource allocation -- assessing account records, payment records, and operational priorities using structured data analysis, and applying rule-based reasoning to determine correct outcomes under real business constraints. This gives me a working sense of what a genuine accounts-receivable / cash-application operation actually has to balance (matching incoming payments to the right open invoices, respecting per-customer boundaries, working within short-pay tolerances) and what a realistic versus contrived version of that problem looks like. I also evaluate AI-generated business outputs against predefined criteria and have supported AI training/evaluation projects involving business reasoning and quality assurance across operational scenarios, which is directly relevant to judging whether this task's grading (an independently recomputed score against a calibrated cost bar) is a fair and meaningful test rather than an arbitrary one. I am not an optimization engineer and have not previously built combinatorial solvers; the technical implementation (the scoring engine, the two-stage verifier, and the calibration of the pass bar against measured baseline and reference policy performance) was built with AI assistance under my direction, with my own judgment applied to whether the matching rules and grading reflect a realistic cash-application operation.
"""

