artifacts = ["/app/outputs"]

[task]
name = "afterquery/cash-application-matching"

[metadata]
author_name = "Tonny Muthoka"
author_email = "tonnysammy952@gmail.com"

difficulty_explanation = """
This work is performed by accounts-receivable / cash-application analysts at any company that receives batches of customer payments against open invoices -- a real, widely outsourced finance operation, since a payment's own reference data is frequently incomplete or absent and the correct application has to be worked out from amounts alone. The agent must submit code that partitions a batch of payments among open invoices (each payment applied whole to at most one invoice, but multiple payments may combine to cover a single invoice) to minimize unresolved dollars, which is the Multiple Subset-Sum problem. Four earlier calibrations of this task were each shown wrong by direct measurement, and all four corrections are reflected in the current design. First: per-customer instances are now large enough (20-30 payments, 15-22 invoices; 10 customers per scenario) that exact solving is not merely slower but impractical -- a bitmask dynamic-programming solver was measured directly on this scenario family and takes 17 seconds at 15 payments and does not finish in 120 seconds at 18, well short of this task's 20-30 range. Second: grading gives the submitted policy a genuine wall-clock budget, not a small number of iterations, and a plain best-fit-decreasing-seeded hill climb that never accepts a worse move can run hundreds of thousands of cheap reassignment attempts in that time -- measured directly on the held-out scenario at multiple budgets from 10 to 75 seconds, this plain approach plateaus well above the bar and does NOT improve with more time, a genuine local-optimum ceiling, not a slow convergence curve, so time alone is not the difficulty lever. Third: a wall-clock-time-based version of the reference (used to establish the second point) turned out to be non-deterministic and unreliable on slower hardware, directly conflicting with the instruction's own determinism requirement -- the reference now uses a FIXED iteration count and restart count instead, confirmed byte-for-byte deterministic across repeated calls. Fourth: a real reviewer found that seeding the search with an exact bitset subset-sum construction (assigning invoices smallest-first, then finding the closest achievable payment combination for each) is a substantially stronger starting point than the best-fit-decreasing greedy the reference had been using -- this construction combined with only a plain, non-annealing hill climb reached 928,781 cents (3.66% of total value uncleared), comfortably clearing the previous, looser bar. This was a genuine algorithmic insight, not a bug, so it was adopted directly into the reference: the current reference combines the same DP seed with the existing fixed-iteration annealing search and reaches 810,433 cents (3.19%), and swept across 5 independently generated scenarios it beats the DP-seed-plus-plain-hill-climb probe by 22.5%-37.5% relative cost every time, with zero exceptions. Six adversarial greedy probe policies (covering every plausible sort-order and accumulation-strategy combination we could construct without the DP seed) land far above both the DP-seed probe and the reference. All scenario data is synthetically generated for this task and does not represent any real company's receivables.
"""

solution_explanation = """
The reference solution seeds each customer's assignment with an exact bitset subset-sum construction (invoices processed smallest-first; for each, the achievable combination of that customer's remaining payments closest to the invoice amount is found and assigned, using Python's arbitrary-precision integers as bit vectors over achievable sums -- a classic value-domain dynamic-programming technique), then refines that seed with simulated annealing over reassignment moves, independently per customer, with a FIXED iteration count (15000) and FIXED restart count (25) -- deliberately not wall-clock-time-based. This DP-seed construction replaced an earlier best-fit-decreasing greedy seed after a real reviewer measured that the DP seed alone, combined with nothing more than a plain first-improvement hill climb, reached 928,781 cents (3.66% of total value) on the held-out scenario -- a substantially better construction than best-fit-decreasing, and one the reference had not been using. Rather than only patch around that one probe, the DP seed was adopted into the reference itself: combined with the existing fixed-iteration annealing search, it reaches 810,433 cents (3.19%) on the held-out scenario, and swept across 5 independently generated scenarios beats the DP-seed-plus-plain-hill-climb probe by 22.5%-37.5% relative cost every time, with zero exceptions. An earlier version of the search scaled to a wall-clock deadline with an adaptively-calibrated cooling schedule; that was found to make the reference's own output non-deterministic (different final costs across repeated runs on a loaded host) and unreliable on slower hardware, directly violating the instruction's own stated determinism requirement -- the fixed-iteration design fixes this and was verified deterministic by direct repeated testing: two consecutive calls to match() with the same inputs produce byte-for-byte identical output (cost 810,433 cents both times on the held-out scenario), enforced going forward by a dedicated test (see verification_explanation). Both calls together complete in roughly 47 seconds on ordinary hardware -- only the wall-clock DURATION varies with machine speed, never the result. The pass bar (855,000 cents, ~3.37% of total value) sits between the DP-seed-plus-hill-climb probe and the full reference, closer to the reference, and far below every plain-greedy adversarial probe.
"""

verification_explanation = """
The verifier never executes the candidate's code in the trusted stage and never trusts anything the untrusted stage computes. Stage 1 (unprivileged, 140-second wall-clock budget covering two calls, UID-swept after running) imports the candidate's submitted policy module and calls its match(payments, invoices) function TWICE against the sealed held-out scenario, with identical inputs both times -- but the only thing it hands off to Stage 2 is the two raw returned mappings, not a computed score and not an equality judgment. Stage 2 (trusted, root, executes no candidate code at all) independently checks the two mappings for exact equality (the instruction's determinism requirement, now with direct test coverage: test_deterministic_output) and separately recomputes the score from the first mapping and the same sealed scenario data, using the same scoring function that also enforces every legality rule from scratch (a payment applied to a nonexistent invoice, or to an invoice belonging to a different customer, is dropped, not trusted). A fabricated or nonsensical mapping can only score as its literal content allows once independently re-validated -- there is no step where Stage 2 takes Stage 1's word for anything. The pass bar (855,000 cents) is compared against this independently recomputed cost. Both the sealed reference directory and the reward file's own directory are locked to root-only access before Stage 1 ever starts, independent of the untrusted-process sweep that also runs after each stage. The reference solution completes both calls in roughly 47 seconds combined, comfortably inside the 140-second budget even on considerably slower hardware.
"""

category = "Operations"
subcategory = "Finance"
tags = ["accounts-receivable", "cash-application", "finance", "matching", "combinatorial-optimization", "invoice-reconciliation"]
expert_time_estimate_hours = 6
relevant_experience = """
I work as an operations and business data analyst (2024-present), where I have directly reviewed business scenarios involving financial operations, reconciliation, and resource allocation -- assessing account records, payment records, and operational priorities using structured data analysis, and applying rule-based reasoning to determine correct outcomes under real business constraints. This gives me a working sense of what a genuine accounts-receivable / cash-application operation actually has to balance (matching incoming payments to the right open invoices, respecting per-customer boundaries, working within short-pay tolerances) and what a realistic versus contrived version of that problem looks like. I also evaluate AI-generated business outputs against predefined criteria and have supported AI training/evaluation projects involving business reasoning and quality assurance across operational scenarios, which is directly relevant to judging whether this task's grading (an independently recomputed score against a calibrated cost bar) is a fair and meaningful test rather than an arbitrary one. I am not an optimization engineer and have not previously built combinatorial solvers; the technical implementation (the scoring engine, the two-stage verifier, and the calibration of the pass bar against measured baseline and reference policy performance) was built with AI assistance under my direction, with my own judgment applied to whether the matching rules and grading reflect a realistic cash-application operation.
"""

