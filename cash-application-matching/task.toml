artifacts = ["/app/outputs"]

[task]
name = "afterquery/cash-application-matching"

[metadata]
author_name = "Tonny Muthoka"
author_email = "tonnysammy952@gmail.com"

difficulty_explanation = """
This work is performed by accounts-receivable / cash-application analysts at any company that receives batches of customer payments against open invoices -- a real, widely outsourced finance operation, since a payment's own reference data is frequently incomplete or absent and the correct application has to be worked out from amounts alone. The agent must submit code that partitions a batch of payments among open invoices (each payment applied whole to at most one invoice, but multiple payments may combine to cover a single invoice) to minimize unresolved dollars, which is the Multiple Subset-Sum problem. Three earlier calibrations of this task were each shown wrong by direct measurement, and all three corrections are reflected in the current design. First: per-customer instances are now large enough (20-30 payments, 15-22 invoices; 10 customers per scenario) that exact solving is not merely slower but impractical -- a bitmask dynamic-programming solver was measured directly on this scenario family and takes 17 seconds at 15 payments and does not finish in 120 seconds at 18, well short of this task's 20-30 range. Second: grading gives the submitted policy a genuine wall-clock budget, not a small number of iterations, and a plain best-fit-decreasing-seeded hill climb that never accepts a worse move can run hundreds of thousands of cheap reassignment attempts in that time -- measured directly on the held-out scenario at multiple budgets from 10 to 75 seconds, this plain approach lands at 5.6%-6.6% of total payment value uncleared and does NOT improve with more time, a genuine local-optimum ceiling, not a slow convergence curve, so time alone is not the difficulty lever. Third: a wall-clock-time-based version of the reference (used to establish the second point) turned out to be non-deterministic and unreliable on slower hardware, directly conflicting with the instruction's own determinism requirement -- the reference now uses a FIXED iteration count and restart count instead, confirmed byte-for-byte deterministic across repeated calls, reaching 4.5% at that fixed effort level. Six adversarial greedy probe policies (covering every plausible sort-order and accumulation-strategy combination we could construct) were swept across 15 independently generated scenarios and land at 16.1%-22.6% uncleared with zero exceptions. All scenario data is synthetically generated for this task and does not represent any real company's receivables.
"""

solution_explanation = """
The reference solution runs simulated annealing over reassignment moves, seeded by a best-fit-decreasing greedy construction, independently per customer, with a FIXED iteration count (8000) and FIXED restart count (15) -- deliberately not wall-clock-time-based. An earlier version scaled its search to a wall-clock deadline with an adaptively-calibrated cooling schedule; a real reviewer measured that this made the reference's own output non-deterministic (different final costs across repeated runs on a loaded host, ranging 1.02M-1.17M) and unreliable on slower hardware (a ~4x-slower-equivalent budget twice failed to clear the bar) -- directly violating the instruction's own stated determinism requirement, which also had no test coverage at the time. Both are fixed now. The fixed-iteration design was verified deterministic by direct repeated testing: two consecutive calls to match() with the same inputs produce byte-for-byte identical output, confirmed on the held-out scenario (cost 1,150,937 cents both times) and enforced going forward by a dedicated test (see verification_explanation). It completes in roughly 7.6-7.8 seconds on ordinary hardware -- only the wall-clock DURATION varies with machine speed, never the result. The pass bar (1,250,000 cents, ~4.9% of total value) sits just above this reference's measured cost and far below every adversarial probe, including a plain (non-annealing) hill climb given a full, generous wall-clock budget of its own, which fails BOTH the cost bar (plateaus at 6.3%-6.6% regardless of how much time it's given) and the new determinism test (its own iteration count, and therefore its output, varies between the two required calls).
"""

verification_explanation = """
The verifier never executes the candidate's code in the trusted stage and never trusts anything the untrusted stage computes. Stage 1 (unprivileged, 140-second wall-clock budget covering two calls, UID-swept after running) imports the candidate's submitted policy module and calls its match(payments, invoices) function TWICE against the sealed held-out scenario, with identical inputs both times -- but the only thing it hands off to Stage 2 is the two raw returned mappings, not a computed score and not an equality judgment. Stage 2 (trusted, root, executes no candidate code at all) independently checks the two mappings for exact equality (the instruction's determinism requirement, now with direct test coverage: test_deterministic_output) and separately recomputes the score from the first mapping and the same sealed scenario data, using the same scoring function that also enforces every legality rule from scratch (a payment applied to a nonexistent invoice, or to an invoice belonging to a different customer, is dropped, not trusted). A fabricated or nonsensical mapping can only score as its literal content allows once independently re-validated -- there is no step where Stage 2 takes Stage 1's word for anything. The pass bar (1,250,000 cents) is compared against this independently recomputed cost. Both the sealed reference directory and the reward file's own directory are locked to root-only access before Stage 1 ever starts, independent of the untrusted-process sweep that also runs after each stage. The reference solution completes both calls in under 16 seconds combined, comfortably inside the 140-second budget even on much slower hardware.
"""

category = "Operations"
subcategory = "Finance"
tags = ["accounts-receivable", "cash-application", "finance", "matching", "combinatorial-optimization", "invoice-reconciliation"]
expert_time_estimate_hours = 6
relevant_experience = """
I work as an operations and business data analyst (2024-present), where I have directly reviewed business scenarios involving financial operations, reconciliation, and resource allocation -- assessing account records, payment records, and operational priorities using structured data analysis, and applying rule-based reasoning to determine correct outcomes under real business constraints. This gives me a working sense of what a genuine accounts-receivable / cash-application operation actually has to balance (matching incoming payments to the right open invoices, respecting per-customer boundaries, working within short-pay tolerances) and what a realistic versus contrived version of that problem looks like. I also evaluate AI-generated business outputs against predefined criteria and have supported AI training/evaluation projects involving business reasoning and quality assurance across operational scenarios, which is directly relevant to judging whether this task's grading (an independently recomputed score against a calibrated cost bar) is a fair and meaningful test rather than an arbitrary one. I am not an optimization engineer and have not previously built combinatorial solvers; the technical implementation (the scoring engine, the two-stage verifier, and the calibration of the pass bar against measured baseline and reference policy performance) was built with AI assistance under my direction, with my own judgment applied to whether the matching rules and grading reflect a realistic cash-application operation.
"""

